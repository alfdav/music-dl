[project]
name = "music-dl"
version = "1.7.7"
description = "music-dl — CLI Tidal downloader with next-generation features."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
authors = [{ name = "alfdav" }]
maintainers = [{ name = "alfdav" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "certifi>=2026.2.25",
  "requests~=2.33.0",
  "mutagen>=1.47.0",

  "m3u8>=6.0.0",
  "rich>=14.0.0",
  "typer>=0.12.0",
  "tidalapi>=0.8.11",

  "pycryptodome>=3.20.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
]

[project.scripts]
music-dl = "tidal_dl.cli:main"
tidal-dl = "tidal_dl.cli:main"

[project.urls]
repository = "https://github.com/alfdav/music-dl"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tidal_dl*"]

[tool.setuptools.package-data]
"tidal_dl.gui" = ["static/**/*"]

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true

[project.optional-dependencies]
test = ["pytest>=9.0.3", "httpx>=0.27"]
# Desktop-app bundling (PyInstaller sidecar for Tauri). Isolated so
# `uv sync` doesn't install it for every dev; install with
# `uv pip install -e ".[build]"` or `uv sync --extra build`.
build = ["pyinstaller>=6.19,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.*:",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff==0.16.1",
]
